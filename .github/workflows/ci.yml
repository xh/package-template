# CI - Validates formatting, linting, type-checking, unit tests, and the packed package on PRs and
# pushes to main.
#
# This workflow does not publish artifacts. For release publishing, see Deploy Release.

name: CI

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

# Only the latest commit's result matters - cancel superseded runs for the same PR or branch.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
        - uses: actions/checkout@v7

        # Installs the pnpm version pinned via the packageManager field in package.json.
        - name: Setup pnpm
          uses: pnpm/setup@v3
          with:
              # `install: false` - this workflow runs its own install step below, after
              # Font Awesome registry auth, and with --frozen-lockfile.
              install: false
              # `node-version-file: false` - actions/setup-node below owns Node.
              node-version-file: false

        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
              node-version-file: '.nvmrc'
              cache: 'pnpm'

        # Required because @xh/hoist (a devDependency, for type-checking and tests) depends on the
        # private Font Awesome Pro registry.
        - name: Configure Font Awesome registry auth
          env:
              FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
          run: echo "//npm.fontawesome.com/:_authToken=$FONTAWESOME_PACKAGE_TOKEN" >> .npmrc

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        # Runs eslint, stylelint, and prettier --check (see package.json `lint:all`).
        - name: Lint
          run: pnpm lint

        - name: Type check
          run: pnpm typecheck

        # On GitHub Actions, Vitest also annotates failures on the PR diff.
        - name: Unit tests
          run: pnpm test

        # The package ships as source, so its build is the packed tarball. This runs `prepack`,
        # which builds the Hoist Docs index and fails on a bad doc registry, then lists what ships.
        - name: Build package
          run: pnpm pack --dry-run
